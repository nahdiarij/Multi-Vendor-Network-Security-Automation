# =====================
# ROUTEURS CISCO
# =====================
[routers]
R2   ansible_host=192.x.x.x
R3   ansible_host=192.x.x.x
R13  ansible_host=192.x.x.x
R14  ansible_host=192.x.x.x
R15  ansible_host=192.x.x.x

[routers:vars]
ansible_user=admin
ansible_password=CHANGE_ME
ansible_network_os=ios
ansible_connection=network_cli
ansible_become=yes
ansible_become_method=enable
ansible_become_password=CHANGE_ME
ansible_network_cli_ssh_type=paramiko
ansible_paramiko_host_key_auto_add=true
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa'

# =====================
# SWITCHES CISCO
# =====================
[switches]
SW1      ansible_host=192.x.x.x
SW-1P    ansible_host=192.x.x.x
Switch39 ansible_host=192.x.x.x
Switch   ansible_host=192.x.x.x

[switches:vars]
ansible_user=admin
ansible_password=CHANGE_ME
ansible_network_os=ios
ansible_connection=network_cli
ansible_become=yes
ansible_become_method=enable
ansible_become_password=CHANGE_ME
ansible_network_cli_ssh_type=paramiko
# =====================
# ASAv CISCO
# =====================
[asa]
ASAv-bas  ansible_host=192.x.x.x
ASAv-haut ansible_host=192.x.x.x

[asa:vars]
ansible_user=admin
ansible_password=CHANGE_ME
ansible_network_os=asa
ansible_connection=network_cli
ansible_become=yes
ansible_become_method=enable
ansible_become_password=CHANGE_ME
ansible_command_timeout=60
ansible_connect_timeout=60
ansible_network_cli_ssh_type=libssh
ansible_terminal_prompts_re='asav-(bas|haut)[#>]\s*$|ciscoasa[#>]\s*$'
# =====================
# FORTINET
# =====================
[fortinet]
Fortinet1 ansible_host=192.x.x.x fortios_token=CHANGE_ME
Fortinet2 ansible_host=192.x.x.x fortios_token=CHANGE_ME
[fortinet:vars]
ansible_network_os=fortios
ansible_connection=httpapi
ansible_httpapi_use_ssl=no
ansible_httpapi_validate_certs=no
ansible_httpapi_port=80
ansible_user=admin
ansible_password=CHANGE_ME
[linux]
IPS ansible_host=192.x.x.x ansible_user=root ansible_password=CHANGE_ME ansible_connection=ssh ansible_python_interpreter=/usr/bin/python3
