- name: Drift Detection Fortinet
  hosts: fortinet
  gather_facts: no

  tasks:
    - name: Télécharger config actuelle Fortinet
      uri:
        url: "http://{{ ansible_host }}/api/v2/monitor/system/config/backup?scope=global"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_token }}"
        validate_certs: no
        return_content: yes
      register: current_config

    - name: Sauvegarder config actuelle
      copy:
        content: "{{ current_config.content }}"
        dest: "{{ playbook_dir }}/drift_tmp/{{ inventory_hostname }}_current.txt"
      delegate_to: localhost

    - name: Comparer avec backup de référence
      command: >
        diff {{ playbook_dir }}/backups/{{ backup_date }}/{{ inventory_hostname }}_backup.conf
             {{ playbook_dir }}/drift_tmp/{{ inventory_hostname }}_current.txt
      register: diff_result
      delegate_to: localhost
      ignore_errors: yes
      changed_when: diff_result.rc == 1
      failed_when: diff_result.rc > 1

    - name: "⚠️  DERIVE DETECTEE"
      debug:
        msg: "{{ diff_result.stdout }}"
      when: diff_result.rc == 1

    - name: "✅ Aucune dérive"
      debug:
        msg: "Aucune dérive sur {{ inventory_hostname }}"
      when: diff_result.rc == 0
