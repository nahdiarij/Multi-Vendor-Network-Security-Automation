---
- name: Collecter config Fortinet via API
  uri:
    url: "http://{{ ansible_host }}/api/v2/monitor/system/config/backup?scope=global"
    method: GET
    headers:
      Authorization: "Bearer {{ fortios_token }}"
    validate_certs: no
    return_content: yes
  register: fortinet_info

- name: Sauvegarder config Fortinet
  copy:
    content: "{{ fortinet_info.content | default('') }}"
    dest: "{{ playbook_dir }}/backups/{{ lookup('pipe', 'date +%Y-%m-%d') }}/{{ inventory_hostname }}_backup.conf"
  delegate_to: localhost
  when: fortinet_info.content is defined

- name: Déployer policies firewall
  uri:
    url: "http://{{ ansible_host }}/api/v2/cmdb/firewall/policy/{{ item.policyid }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ fortios_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item }}"
    validate_certs: no
    status_code: [200, 201]
  loop: "{{ firewall_policies | default([]) }}"
  when: firewall_policies is defined
