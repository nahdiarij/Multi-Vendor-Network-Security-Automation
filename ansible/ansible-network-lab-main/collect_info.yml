# ================================
# Playbook : Collecte d'informations
# Equipements : Routeurs et Switches
# ================================

- name: Collecte infos Routeurs et Switches
  hosts: routers:switches
  gather_facts: no

  tasks:
    - name: Show Version
      ios_command:
        commands:
          - show version
      register: version_output

    - name: Show IP Interface Brief
      ios_command:
        commands:
          - show ip interface brief
      register: interfaces_output

    - name: Show IP Route
      ios_command:
        commands:
          - show ip route
      register: route_output

    - name: Afficher Version
      debug:
        msg: "{{ version_output.stdout_lines }}"

    - name: Afficher Interfaces
      debug:
        msg: "{{ interfaces_output.stdout_lines }}"

    - name: Afficher Routes
      debug:
        msg: "{{ route_output.stdout_lines }}"

# ================================
# Collecte infos ASAv
# ================================

- name: Collecte infos ASAv
  hosts: asa
  gather_facts: no

  tasks:
    - name: Show Version ASA
      asa_command:
        commands:
          - show version
      register: asa_version

    - name: Show Interface ASA
      asa_command:
        commands:
          - show ip interface brief
      register: asa_interfaces

    - name: Afficher Version ASA
      debug:
        msg: "{{ asa_version.stdout_lines }}"

    - name: Afficher Interfaces ASA
      debug:
        msg: "{{ asa_interfaces.stdout_lines }}"
    - name: Test ASA raw
      hosts: asa
      gather_facts: no
      connection: network_cli
      vars:
       ansible_network_os: asa

  tasks:
    - name: Test prompt
      ansible.netcommon.cli_command:
        command: show version
      register: output

    - debug:
        msg: "{{ output.stdout }}"
# ================================
# Collecte infos Fortinet
# ================================
- name: Collecte infos Fortinet
  hosts: fortinet
  gather_facts: no
  connection: local

  tasks:
    - name: Get System Global
      uri:
        url: "http://{{ ansible_host }}/api/v2/cmdb/system/global"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_token }}"
        validate_certs: no
        status_code: 200
      register: fortinet_info

    - name: Afficher infos Fortinet
      debug:
        msg: "{{ fortinet_info.json }}"
- name: Collect info from IPS (Ubuntu/Snort)
  hosts: linux
  gather_facts: yes
  tasks:
    - name: Get Snort version
      command: snort --version
      register: snort_version
      ignore_errors: yes

    - name: Get network interfaces
      command: ip addr show
      register: interfaces

    - name: Get Snort service status
      command: systemctl status snort-ids
      register: snort_status
      ignore_errors: yes
    - name: Create backup directory
      file:
        path: /tmp/backup
        state: directory
      delegate_to: localhost
    - name: Save IPS info to file
      copy:
        content: |
          === IPS Info ===
          {{ snort_version.stdout | default('Snort non trouve') }}
          === Interfaces ===
          {{ interfaces.stdout }}
          === Snort Status ===
          {{ snort_status.stdout | default('Service non trouve') }}
        dest: "/tmp/backup/IPS_info.txt"
      delegate_to: localhost
