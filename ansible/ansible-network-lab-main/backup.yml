# ================================
# Backup Fortinet via REST API
# ================================
- name: Backup Fortinet
  hosts: fortinet
  gather_facts: no
  connection: local

  tasks:
    - name: Créer dossier backup local
      file:
        path: "./backups/{{ lookup('pipe', 'date +%Y-%m-%d') }}"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Télécharger config Fortinet via API
      uri:
        url: "http://{{ ansible_host }}/api/v2/monitor/system/config/backup?scope=global"
        method: GET
        headers:
          Authorization: "Bearer {{ fortios_token }}"
        validate_certs: no
        return_content: yes
        status_code: 200
      register: fortinet_backup

    - name: Sauvegarder config Fortinet sur disque
      copy:
        content: "{{ fortinet_backup.content }}"
        dest: "./backups/{{ lookup('pipe', 'date +%Y-%m-%d') }}/{{ inventory_hostname }}_backup.conf"
      delegate_to: localhost
