# ================================
# Playbook : Backup configurations
# Equipements : Routeurs, Switches, ASAv, Fortinet
# ================================

# ================================
# Backup Routeurs Cisco
# ================================
- name: Backup Routeurs Cisco
  hosts: routers
  gather_facts: no

  tasks:
    - name: Créer dossier backup local
      file:
        path: "./backups/{{ lookup('pipe', 'date +%Y-%m-%d') }}"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Backup running-config routeurs
      ios_command:
        commands:
          - show running-config
      register: router_config

    - name: Sauvegarder config routeur sur disque
      copy:
        content: "{{ router_config.stdout[0] }}"
        dest: "./backups/{{ lookup('pipe', 'date +%Y-%m-%d') }}/{{ inventory_hostname }}_running.cfg"
      delegate_to: localhost

