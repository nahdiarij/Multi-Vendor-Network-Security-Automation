[defaults]
inventory = ./inventory.ini
host_key_checking = False
timeout = 60

[persistent_connection]
connection_timeout = 30
command_timeout = 30
[ssh_connection]
ssh_args = -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1 -o MACs=+hmac-sha1,hmac-sha1-96 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa
usetty = True
transfer_method = smart
